spring.application.name=gradpath-ai
server.port=${PORT:8080}
# Honour X-Forwarded-* headers from the hosting proxy so HTTPS is detected (secure cookies, redirects).
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# ---- GradPath settings (values come from environment variables or the git-ignored .env file) ----
gradpath.database-url=${DATABASE_URL:}
gradpath.local-database-file=${H2_FILE:./data/local/gradpath}
gradpath.officer-access-code=${OFFICER_ACCESS_CODE:}
gradpath.demo-login-enabled=${ENABLE_DEMO_LOGIN:false}
gradpath.seed-demo-data=${SEED_DEMO_DATA:false}
gradpath.default-cgpa-scale=${CGPA_SCALE:4.0}
gradpath.cookie-secure=${COOKIE_SECURE:false}
gradpath.chat.provider=${CHATBOT_PROVIDER:rule}
gradpath.chat.groq-api-key=${GROQ_API_KEY:}
gradpath.chat.groq-model=${GROQ_MODEL:llama-3.3-70b-versatile}
gradpath.chat.openai-api-key=${OPENAI_API_KEY:}
gradpath.chat.openai-model=${OPENAI_MODEL:gpt-4o-mini}
gradpath.chat.gemini-api-key=${GEMINI_API_KEY:}
gradpath.chat.gemini-model=${GEMINI_MODEL:gemini-2.0-flash}
gradpath.chat.anthropic-api-key=${ANTHROPIC_API_KEY:}
gradpath.chat.anthropic-model=${ANTHROPIC_MODEL:claude-haiku-5-5}
# Optional: a placement model trained with "train-model"; blank = the model bundled in the jar
gradpath.ml.model-path=${PLACEMENT_MODEL_PATH:}

# ---- Persistence: Flyway owns the schema; Hibernate only validates the mapping ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# An existing database (created by the earlier version) is baselined at V1 and only receives additive migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---- Uploads (resume PDFs) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=8MB

# ---- Templates ----
spring.thymeleaf.cache=true
# Render each page fully before sending it, so headers (e.g. the CSRF cookie) are never written too late.
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

logging.level.org.hibernate.orm.deprecation=error
logging.level.org.hibernate.orm.connections.pooling=warn
