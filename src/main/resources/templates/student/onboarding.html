<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{layouts/public :: layout(~{::title}, ~{::#page})}">
<head><title>Set up your profile - GradPath AI</title></head>
<body>
<div id="page" th:remove="tag">
    <header class="topnav">
        <span class="brand"><span th:replace="~{fragments/ui :: logo(36)}"></span><b>GradPath <i>AI</i></b></span>
        <form th:action="@{/logout}" method="post"><button type="submit" class="btn small">Sign out</button></form>
    </header>
    <section class="hero" style="padding:1.6rem 1.8rem;margin-bottom:1.2rem">
        <span class="badge b-violet">Step 1 of 1 - set up your profile</span>
        <h1 style="font-size:2.1rem" th:text="'Welcome, ' + ${student.firstName()} + '! Time to build your profile.'">Welcome!</h1>
        <p>It takes about two minutes. Your answers power your readiness score, skill-gap analysis and job matches, so
            honest details give you better guidance. Fields marked <span class="req">*</span> are required.</p>
    </section>
    <div th:replace="~{fragments/ui :: flash}"></div>
    <form th:replace="~{fragments/profile-form :: form('/onboarding', 'Finish and go to my dashboard', null)}"></form>
</div>
</body>
</html>
