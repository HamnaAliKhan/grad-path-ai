# Test profile: in-memory H2 (PostgreSQL mode) - tests never touch Neon or any AI provider.
gradpath.database-url=jdbc:h2:mem:gradpath-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
gradpath.officer-access-code=TEST-CODE
gradpath.demo-login-enabled=false
gradpath.seed-demo-data=false
gradpath.chat.provider=rule
gradpath.chat.groq-api-key=
# Validate the JPA mapping against the Flyway-created schema.
spring.jpa.hibernate.ddl-auto=validate
logging.level.root=WARN
