<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:replace="~{layouts/app :: layout(~{::title}, ~{::#page})}">
<head><title>Career details - GradPath AI</title></head>
<body>
<div id="page" th:remove="tag">
<p><a th:href="@{/student/careers}">&larr; All careers</a></p>
<div class="page-head">
    <div class="title" th:text="${career.name()}">Career</div>
    <div class="sub" th:text="${career.description()}">description</div>
</div>
<div class="card">
    <div th:replace="~{fragments/ui :: progress(${gap.match()}, 'Your current skill match', ${gap.match() >= 70 ? 'green' : ''})}"></div>
</div>
<div class="grid g2">
    <div>
        <div class="card"><h4>Typical responsibilities</h4>
            <ul class="list"><li th:each="r : ${career.responsibilities()}" th:text="${r}">r</li></ul></div>
        <div class="card"><h4>Skills employers often look for</h4>
            <span th:each="r : ${gap.rows()}" class="badge" th:classappend="'b-' + ${@ui.skillKind(r.status())}"
                  th:text="${r.skill() + ' (' + r.importanceLabel() + ')'}">Skill</span>
            <p class="mt-s">Green = you have it, amber = still learning, red = missing.</p></div>
    </div>
    <div>
        <div class="card"><h4>Recommended preparation</h4>
            <ul class="list"><li th:each="p : ${career.preparation()}" th:text="${p}">p</li></ul></div>
        <div class="card"><h4>Portfolio project ideas</h4>
            <ul class="list"><li th:each="p : ${career.projects()}" th:text="${p}">p</li></ul></div>
    </div>
</div>
<p class="row-start">
    <a class="btn primary" th:href="@{/student/skill-gap(career=${career.name()})}">Open full skill-gap analysis</a>
    <a class="btn" th:href="@{/student/jobs(category=${career.name()})}">See matching jobs</a>
</p>
<p class="muted small mt" th:text="${catalogDisclaimer}">disclaimer</p>
</div>
</body>
</html>
